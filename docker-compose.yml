services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alethia_cosmetics
    ports:
      - "5433:5432"
    volumes:
      - alethia_cosmetics_pg:/var/lib/postgresql/data

volumes:
  alethia_cosmetics_pg:
